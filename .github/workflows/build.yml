name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller로 EXE 빌드
        run: |
          pyinstaller --onefile --noconsole --name Teleprompter teleprompter.py

      - name: 빌드 결과물 업로드 (Actions 탭에서 다운로드용)
        uses: actions/upload-artifact@v4
        with:
          name: Teleprompter-windows-exe
          path: dist/Teleprompter.exe

      - name: 태그 푸시 시 릴리스에 자동 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Teleprompter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
